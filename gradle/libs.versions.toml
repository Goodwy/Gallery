[versions]
#jetbrains
kotlin = "2.3.20"
#KSP
ksp = "2.3.9"
#Detekt
detekt = "1.23.8"
detektCompose = "0.4.28"
#AndroidX
androidx-lifecycle = "2.11.0"
androidx-print = "1.1.0"
androidx-swiperefreshlayout = "1.2.0"
androidx-constraintlayout = "2.2.1"
androidx-documentfile = "1.1.0"
#exif
exif = "1.0.1"
#Room
room = "2.8.4"
#Goodwy
right-commons = "d52444f7a0"
behavioRule = "1.0.1"
rxAnimation = "2.1.1"
#Gradle
gradlePlugins-agp = "9.2.0"
gradlePlugins-baselineProfile = "1.5.0-rc02"
#Benchmark / Baseline Profile
benchmarkMacroJunit4 = "1.5.0-rc02"
profileinstaller = "1.4.1"
androidxTestRunner = "1.7.0"
androidxTestExtJunit = "1.3.0"
androidxTestUiautomator = "2.4.0"
#Other
androidGifDrawable = "1.2.31"
androidImageCropper = "4.7.0"
animationAndroid = "3.0.5"
glideCompiler = "5.0.7"
zjupureWebpdecoder = "2.7.4.16.0"
jxlDecoder = "2.6.0"
gestureviews = "4d35394d6c"
androidsvgAar = "1.4"
sanselan = "0.97-incubator"
media3Exoplayer = "1.11.0"
okhttp = "5.5.0" #4.10.0 not conflicts with maven { setUrl("https://artifactory-external.vkpartner.ru/artifactory/maven") }
okio = "3.18.1"
picasso = "2.71828"
subsamplingScaleImageView = "ca5f76adc0"
#build
app-build-compileSDKVersion = "37"
app-build-targetSDK = "37"
app-build-minimumSDK = "26"
app-build-javaVersion = "VERSION_17"
app-build-kotlinJVMTarget = "17"
[libraries]
#AndroidX
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime", version.ref = "androidx-lifecycle" }
androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3Exoplayer" }
androidx-swiperefreshlayout = { module = "androidx.swiperefreshlayout:swiperefreshlayout", version.ref = "androidx-swiperefreshlayout" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "androidx-constraintlayout" }
androidx-print = { module = "androidx.print:print", version.ref = "androidx-print" }
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "androidx-documentfile" }
#exif
exif = { module = "it.sephiroth.android.exif:library", version.ref = "exif" }
#Room
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
#Compose
compose-detekt = { module = "io.nlopez.compose.rules:detekt", version.ref = "detektCompose" }
#Goodwy
goodwy-commons-gplay = { module = "com.github.catpieleaf.goodwy-commons:commons-gplay", version.ref = "right-commons" }
goodwy-commons-foss = { module = "com.github.catpieleaf.goodwy-commons:commons-foss", version.ref = "right-commons" }
goodwy-commons-rustore = { module = "com.github.catpieleaf.goodwy-commons:commons-rustore", version.ref = "right-commons" }
behavio-rule = { module = "com.github.Liverm0r:BehavioRule", version.ref = "behavioRule" }
rx-animation = { module = "com.mikhaellopez:rxanimation", version.ref = "rxAnimation" }
#Other
android-gif-drawable = { module = "pl.droidsonroids.gif:android-gif-drawable", version.ref = "androidGifDrawable" }
android-image-cropper = { module = "com.vanniktech:android-image-cropper", version.ref = "androidImageCropper" }
subsamplingscaleimageview = { module = "com.github.goodwy:subsampling-scale-image-view", version.ref = "subsamplingScaleImageView" }
androidsvg-aar = { module = "com.caverock:androidsvg-aar", version.ref = "androidsvgAar" }
gestureviews = { module = "com.github.goodwy:gestureviews", version.ref = "gestureviews" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
sanselan = { module = "org.apache.sanselan:sanselan", version.ref = "sanselan" }
apng = { module = "com.github.penfeizhou.android.animation:apng", version.ref = "animationAndroid" }
awebp = { module = "com.github.penfeizhou.android.animation:awebp", version.ref = "animationAndroid" }
avif = { module = "com.github.penfeizhou.android.animation:avif", version.ref = "animationAndroid" }
glide-compiler = { module = "com.github.bumptech.glide:ksp", version.ref = "glideCompiler" }
zjupure-webpdecoder = { module = "com.github.zjupure:webpdecoder", version.ref = "zjupureWebpdecoder" }
picasso = { module = "com.squareup.picasso:picasso", version.ref = "picasso" }
avif-integration = { group = "com.github.bumptech.glide", name = "avif-integration", version.ref = "glideCompiler" }
jxl-integration = { group = "io.github.awxkee", name = "jxl-coder-glide", version.ref = "jxlDecoder" }
#Benchmark / Baseline Profile
androidx-benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "benchmarkMacroJunit4" }
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "androidxTestUiautomator" }
[bundles]
room = [
    "androidx-room-ktx",
    "androidx-room-runtime",
]
[plugins]
android = { id = "com.android.application", version.ref = "gradlePlugins-agp" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
baselineProfile = { id = "androidx.baselineprofile", version.ref = "gradlePlugins-baselineProfile" }
